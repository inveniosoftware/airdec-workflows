apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orcha.fullname" . }}-app-config
  labels:
    {{- include "orcha.labels" . | nindent 4 }}
data:
  JWT_ALGORITHM: {{ .Values.appConfig.jwtAlgorithm | quote }}
  AUTH_DISABLED: {{ .Values.appConfig.authDisabled | quote }}
  TENANTS_CONFIG_PATH: {{ .Values.appConfig.tenantsConfigPath | quote }}
  ALLOWED_ORIGINS: {{ .Values.appConfig.allowedOrigins | quote }}
  LANGFUSE_ENABLED: {{ .Values.appConfig.langfuseEnabled | quote }}
  {{- if .Values.appConfig.langfuseBaseUrl }}
  LANGFUSE_BASE_URL: {{ .Values.appConfig.langfuseBaseUrl | quote }}
  {{- end }}
  {{- if .Values.appConfig.pdfHttpAllowlist }}
  PDF_HTTP_ALLOWLIST: {{ .Values.appConfig.pdfHttpAllowlist | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orcha.fullname" . }}-llm-config
  labels:
    {{- include "orcha.labels" . | nindent 4 }}
data:
  {{- if .Values.llmConfig.llmModel }}
  LLM: {{ .Values.llmConfig.llmModel | quote }}
  {{- end }}
  LITELLM_API_BASE: {{ .Values.llmConfig.litellmApiBase | quote }}
  OLLAMA_BASE_URL: {{ .Values.llmConfig.ollamaBaseUrl | quote }}
