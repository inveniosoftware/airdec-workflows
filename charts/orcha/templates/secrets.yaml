{{- if not .Values.secrets.db.existingSecret }}
{{- if not .Values.secrets.db.password }}
{{- fail "secrets.db.password is required when secrets.db.existingSecret is not set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orcha.dbSecretName" . }}
  labels:
    {{- include "orcha.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.secrets.db.password | b64enc | quote }}
{{- end }}
---
{{- if not .Values.secrets.llm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orcha.llmSecretName" . }}
  labels:
    {{- include "orcha.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.llm.litellmApiKey }}
  litellmApiKey: {{ .Values.secrets.llm.litellmApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.ollamaApiKey }}
  ollamaApiKey: {{ .Values.secrets.llm.ollamaApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
